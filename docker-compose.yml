version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: tradingjournal_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network

  app:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Database connection string for SQLAlchemy + asyncpg
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/tradingjournal_db
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000
    depends_on:
      - db
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge
