[alembic]
# Path to the migration scripts
script_location = src/infrastructure/persistence/migrations

# Template used to generate new revision files.
# Default template is '%%(rev)s_%%(slug)s'
# revision_script_template =

# The default module path for environment configuration.
# This is used by 'alembic init' to determine where to place the env.py file.
# env_py_location = src/infrastructure/persistence/migrations/env.py

# The default module path for the script.py.mako template.
# This is used by 'alembic init' to determine where to place the script.py.mako file.
# script_template_location = src/infrastructure/persistence/migrations/script.py.mako

# Generic, non-database specific config.
# This is used by 'alembic init' to determine where to place the alembic.ini file.
# file_template_location = alembic.ini

# A database URL.
# This value is used by the 'alembic' command line utility to connect to the
# database. It is also used by the 'env.py' script to connect to the database
# when it is run in "offline" mode.
# In "online" mode, the 'env.py' script typically gets the database URL
# from an environment variable or a configuration file.
# For this project, the DATABASE_URL environment variable is used in env.py.
# This placeholder is for alembic's internal use if not overridden.
sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/tradingjournal_db

# Logging configuration
# You can customize logging here, but for structured logging,
# it's often handled by the application's logging_config.py.
# For Alembic's internal logging, basic console logging is sufficient.
[loggers]
keys = root, alembic, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[logger_sqlalchemy]
level = WARNING
handlers = console
qualname = sqlalchemy

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5s [%(name)s] %(message)s
datefmt = %H:%M:%S
