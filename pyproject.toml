[project]
name = "design-a-tradingjournal"
version = "0.1.0"
description = "A trading journal application to track trades, analyze performance, and manage trading strategies. Supports CSV import for Fidelity trade history and provides dashboard views."
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
requires-python = ">=3.10"
dependencies = [
    "fastapi~=0.111.0",
    "uvicorn[standard]~=0.30.1",
    "pydantic~=2.7.1",
    "pydantic-settings~=2.2.1",
    "sqlalchemy~=2.0.29",
    "asyncpg~=0.29.0",
    "python-dotenv~=1.0.1",
    "alembic~=1.13.1",
    "pandas~=2.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.2.0",
    "pytest-asyncio~=0.23.6",
    "black~=24.4.2",
    "isort~=5.13.2",
    "flake8~=7.0.0",
    "mypy~=1.10.0",
    "httpx~=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["design_a_tradingjournal"]
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
