[project]
name = "design-a-tradingjournal"
version = "0.1.0"
description = "A trading journal application to track trades, analyze performance, and manage trading strategies. Supports CSV import for Fidelity trade history and provides dashboard views."
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
requires-python = ">=3.10"
dependencies = [
    "fastapi~=0.111.0",
    "uvicorn[standard]~=0.30.1",
    "pydantic~=2.7.1",
    "pydantic-settings~=2.2.1",
    "sqlalchemy~=2.0.29",
    "asyncpg~=0.29.0",
    "python-dotenv~=1.0.1",
    "alembic~=1.13.1",
    "pandas~=2.2.2",
    "python-multipart~=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.2.0",
    "pytest-asyncio~=0.23.6",
    "httpx~=0.27.0",
    "ruff~=0.4.0",
    "mypy~=1.10.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]   # pycodestyle, pyflakes, isort, pyupgrade
ignore = ["E501"]                  # line-too-long handled by formatter

[tool.ruff.lint.per-file-ignores]
# Alembic env.py must import after sys.path manipulation — E402 is intentional
"src/infrastructure/persistence/migrations/env.py" = ["E402", "I001"]
# Migration version files often have unusual import ordering
"src/infrastructure/persistence/migrations/versions/*.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
